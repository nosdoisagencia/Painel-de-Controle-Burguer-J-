<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Burguer Já | Gestão de Pedidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #e63946; --dark: #1b1b1b; --success: #2ecc71; --warning: #f1c40f; --blue: #3498db; }
        body { font-family: 'Lexend', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        
        header { background: var(--dark); color: white; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; }

        /* Estilos Novos: Busca e Filtros */
        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .filter-select { width: 200px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 12px; border-bottom: 1px solid #eee; }

        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-0 { background: #eee; color: #666; }
        .badge-1 { background: var(--warning); color: #000; }
        .badge-2 { background: var(--blue); color: #fff; }
        .badge-3 { background: var(--success); color: #fff; }

        .btn-step { border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; transition: 0.3s; margin-right: 5px; }
        .btn-cozinha { background: var(--warning); color: #000; }
        .btn-rota { background: var(--blue); color: #fff; }
        .btn-whats { background: #25d366; color: #fff; }
        .btn-wait { background: #ccc; color: #666; cursor: not-allowed; }
        .btn-delete { background: #ff4d4d; color: white; padding: 8px 12px; }
        .btn-delete:hover { background: #b30000; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 5px; }
        
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #ddd; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size:20px;">Painel de Controle</h1>
            <span style="font-size:12px; opacity:0.7;">Burguer Já | Gestão de Pedidos</span>
        </div>
        <i class="fas fa-store"></i>
    </header>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="showTab('tab-pedidos', this)">Pedidos Ativos</button>
        <button class="tab-btn" onclick="showTab('tab-config', this)">Configurações</button>
        <button class="tab-btn" onclick="showTab('tab-historico', this)">Histórico</button>
    </div>

    <div id="tab-pedidos" class="tab-content">
        <div class="card">
            <h2><i class="fas fa-utensils"></i> Pedidos em Andamento</h2>
            
            <div class="controls-row">
                <input type="text" id="search-pedidos" class="search-input" placeholder="Buscar por cliente ou item..." onkeyup="render()">
                <select id="filter-status" class="filter-select" onchange="render()">
                    <option value="todos">Todos os Status</option>
                    <option value="0">Cozinha</option>
                    <option value="1">Em Rota</option>
                    <option value="2">Entregue (Aguardando)</option>
                    <option value="3">Feedback Pronto</option>
                </select>
            </div>

            <table id="tabela-pedidos">
                <thead>
                    <tr>
                        <th>Cliente / Itens</th>
                        <th>Status</th>
                        <th>Tempo Feedback</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-dashboard"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-config" class="tab-content hidden">
        <div class="card">
            <h2><i class="fas fa-cog"></i> Ajustes do Sistema</h2>
            <div class="config-grid">
                <div>
                    <label>Tempo p/ Feedback (minutos)</label>
                    <input type="number" id="cfg-tempo" value="30" style="width: 100%;">
                </div>
                <div>
                    <label>Mensagem de Feedback</label>
                    <input type="text" id="cfg-msg" value="Olá! O que achou do seu Burguer Já?" style="width: 100%;">
                </div>
            </div>
            <button class="btn-step" style="background:var(--dark); color:white; margin-top:15px;" onclick="salvarConfig()">Salvar Configurações</button>
        </div>
    </div>

    <div id="tab-historico" class="tab-content hidden">
        <div class="card">
            <h2><i class="fas fa-history"></i> Pedidos Finalizados</h2>
            <div class="controls-row">
                <input type="text" id="search-historico" class="search-input" placeholder="Buscar no histórico..." onkeyup="render()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Data/Hora</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-historico"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://burguer-ja-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let pedidos = [];
    let configs = { tempo: 30, msg: "Olá! O que achou do seu Burguer Já?" };

    database.ref('configuracoes').on('value', (snapshot) => {
        if(snapshot.exists()) {
            configs = snapshot.val();
            document.getElementById('cfg-tempo').value = configs.tempo;
            document.getElementById('cfg-msg').value = configs.msg;
        }
    });

    database.ref('pedidos').on('value', (snapshot) => {
        const data = snapshot.val();
        pedidos = data ? Object.values(data) : [];
        render();
    });

    function render() {
        const dashCorpo = document.getElementById('lista-dashboard');
        const histCorpo = document.getElementById('lista-historico');
        const buscaAtiva = document.getElementById('search-pedidos').value.toLowerCase();
        const filtroStatus = document.getElementById('filter-status').value;
        const buscaHist = document.getElementById('search-historico').value.toLowerCase();

        dashCorpo.innerHTML = '';
        histCorpo.innerHTML = '';
        
        const agora = Date.now();

        pedidos.forEach(p => {
            // Lógica de tempo para o botão de Feedback
            if(p.status === 2 && (agora - p.horaEntrega) >= (configs.tempo * 60000)) {
                p.status = 3;
                database.ref('pedidos/' + p.id).update({ status: 3 });
            }

            // FILTROS DA ABA ATIVOS
            const atendeBusca = p.nome.toLowerCase().includes(buscaAtiva) || p.itens.toLowerCase().includes(buscaAtiva);
            const atendeStatus = filtroStatus === "todos" || p.status == filtroStatus;

            if (p.status < 4 && atendeBusca && atendeStatus) {
                let btnAction = '';
                let tempoTxt = '--';

                if(p.status === 0) {
                    btnAction = `<button class="btn-step btn-cozinha" onclick="mudarStatus('${p.id}', 1)">Saiu p/ Entrega</button>`;
                } else if(p.status === 1) {
                    btnAction = `<button class="btn-step btn-rota" onclick="mudarStatus('${p.id}', 2)">Entregue</button>`;
                } else if(p.status === 2) {
                    const decorrido = Math.floor((agora - p.horaEntrega) / 60000);
                    const restante = configs.tempo - decorrido;
                    btnAction = `<button class="btn-step btn-wait" disabled>Aguardar ${restante}m</button>`;
                    tempoTxt = `${restante} min restante`;
                } else if(p.status === 3) {
                    btnAction = `<button class="btn-step btn-whats" onclick="enviarFeedback('${p.id}')">Feedback</button>`;
                    tempoTxt = `<b style="color:var(--success)">PRONTO!</b>`;
                }

                dashCorpo.innerHTML += `
                    <tr>
                        <td>
                            <b>${p.nome}</b><br>
                            <small>${p.itens}</small><br>
                            <small style="color:#888">${p.telefone}</small>
                        </td>
                        <td><span class="badge badge-${p.status}">${["Cozinha", "Em Rota", "Entregue", "Feedback"][p.status]}</span></td>
                        <td>${tempoTxt}</td>
                        <td>
                            ${btnAction}
                            <button class="btn-step btn-delete" onclick="excluirPedido('${p.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            }

            // ABA HISTÓRICO COM BUSCA
            if(p.status >= 2 && (p.nome.toLowerCase().includes(buscaHist) || p.telefone.includes(buscaHist))) {
                histCorpo.innerHTML += `
                    <tr>
                        <td>${p.nome}</td>
                        <td>${new Date(p.horario).toLocaleString()}</td>
                        <td>${p.telefone}</td>
                        <td>
                            <button class="btn-step btn-delete" onclick="excluirPedido('${p.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            }
        });
    }

    function mudarStatus(id, novo) {
        const updates = { status: novo };
        if(novo === 2) updates.horaEntrega = Date.now();
        database.ref('pedidos/' + id).update(updates);
    }

    // FUNÇÃO DE EXCLUIR COM CONFIRMAÇÃO
    function excluirPedido(id) {
        const certeza = confirm("Tem certeza que deseja excluir este pedido? Esta ação não pode ser desfeita.");
        if (certeza) {
            database.ref('pedidos/' + id).remove()
                .then(() => alert("Pedido removido com sucesso!"))
                .catch((error) => alert("Erro ao remover: " + error));
        }
    }

    function enviarFeedback(id) {
        const p = pedidos.find(item => item.id == id);
        const msg = encodeURIComponent(configs.msg);
        window.open(`https://wa.me/55${p.telefone.replace(/\D/g,'')}?text=${msg}`);
    }

    function salvarConfig() {
        const tempo = document.getElementById('cfg-tempo').value;
        const msg = document.getElementById('cfg-msg').value;
        database.ref('configuracoes').set({ tempo, msg });
        alert("Configurações salvas!");
    }

    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.remove('hidden');
        btn.classList.add('active');
    }

    setInterval(render, 30000); // Atualiza a cada 30 seg para o cronômetro
</script>

</body>
</html>
